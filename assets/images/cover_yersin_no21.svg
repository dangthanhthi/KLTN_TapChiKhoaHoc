<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-yersin-21" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b7a99" />
      <stop offset="35%" stop-color="#2a5d77" />
      <stop offset="70%" stop-color="#152736" />
      <stop offset="100%" stop-color="#0f1b26" />
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="850" fill="url(#bg-yersin-21)" />

  <!-- University Header Bar -->
  <g transform="translate(40, 50)">
    <!-- Yersin Flame Symbol -->
    <path d="M30,5 Q40,25 25,35 Q15,40 30,55 Q10,45 10,25 Q15,15 30,5 Z" fill="#ffffff" />
    <path d="M28,18 Q35,28 26,38 Q35,32 28,18 Z" fill="#3b7a99" />
    <text x="70" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">YERSIN UNIVERSITY</text>
  </g>

  <g transform="translate(560, 50)" text-anchor="end">
    <text x="0" y="30" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">TẠP CHÍ</text>
    <text x="0" y="65" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="800" fill="#ffe066" letter-spacing="1.5">KHOA HỌC YERSIN</text>
    <text x="0" y="88" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="1">TRƯỜNG ĐẠI HỌC YERSIN ĐÀ LẠT</text>
  </g>

  <!-- Illustration Area: Financial Growth & Chart Columns -->
  <g transform="translate(300, 480)">
    <!-- Stock Growth Arrows -->
    <polygon points="170,40 170,-150 200,-150 150,-210 100,-150 130,-150 130,40" fill="url(#arrow-grad)" />
    <polygon points="50,40 50,-80 80,-80 30,-140 -20,-80 10,-80 10,40" fill="rgba(0,229,255,0.7)" />
    <polygon points="-70,40 -70,-30 -40,-30 -90,-90 -140,-30 -110,-30 -110,40" fill="rgba(0,229,255,0.4)" />

    <!-- Coin Stacks (Cột tiền xu xếp tầng) -->
    <!-- Column 1 -->
    <ellipse cx="-160" cy="40" rx="36" ry="12" fill="#d4af37" stroke="#fff" stroke-width="1" />
    <ellipse cx="-160" cy="28" rx="36" ry="12" fill="#f3e5ab" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="-160" cy="16" rx="36" ry="12" fill="#fff8dc" stroke="#d4af37" stroke-width="1" />

    <!-- Column 2 -->
    <ellipse cx="-60" cy="60" rx="44" ry="14" fill="#d4af37" stroke="#fff" stroke-width="1" />
    <ellipse cx="-60" cy="45" rx="44" ry="14" fill="#f3e5ab" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="-60" cy="30" rx="44" ry="14" fill="#fff8dc" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="-60" cy="15" rx="44" ry="14" fill="#f3e5ab" stroke="#d4af37" stroke-width="1" />

    <!-- Column 3 -->
    <ellipse cx="60" cy="80" rx="50" ry="15" fill="#d4af37" stroke="#fff" stroke-width="1" />
    <ellipse cx="60" cy="65" rx="50" ry="15" fill="#f3e5ab" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="60" cy="50" rx="50" ry="15" fill="#fff8dc" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="60" cy="35" rx="50" ry="15" fill="#f3e5ab" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="60" cy="20" rx="50" ry="15" fill="#fff8dc" stroke="#d4af37" stroke-width="1" />

    <!-- Column 4 (Highest) -->
    <ellipse cx="180" cy="100" rx="52" ry="16" fill="#d4af37" stroke="#fff" stroke-width="1" />
    <ellipse cx="180" cy="82" rx="52" ry="16" fill="#f3e5ab" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="180" cy="64" rx="52" ry="16" fill="#fff8dc" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="180" cy="46" rx="52" ry="16" fill="#f3e5ab" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="180" cy="28" rx="52" ry="16" fill="#fff8dc" stroke="#d4af37" stroke-width="1" />
    <ellipse cx="180" cy="10" rx="52" ry="16" fill="#f3e5ab" stroke="#d4af37" stroke-width="1" />
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 780)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff">2025</text>
    <text x="95" y="-12" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffe066">Tập 21</text>
    <text x="95" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Volume 21</text>
  </g>

  <g transform="translate(550, 780)" text-anchor="end">
    <text x="0" y="-4" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#ffe066" letter-spacing="1">ISSN 2525-2372</text>
  </g>
</svg>
