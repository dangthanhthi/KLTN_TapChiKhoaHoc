<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-yersin-22" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b7a99" />
      <stop offset="35%" stop-color="#2a5d77" />
      <stop offset="70%" stop-color="#152736" />
      <stop offset="100%" stop-color="#0f1b26" />
    </linearGradient>
    <radialGradient id="globe-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="70%" stop-color="#d48817" />
      <stop offset="100%" stop-color="#7a4604" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="850" fill="url(#bg-yersin-22)" />

  <!-- University Header Bar -->
  <g transform="translate(40, 50)">
    <!-- Yersin Flame Symbol -->
    <path d="M30,5 Q40,25 25,35 Q15,40 30,55 Q10,45 10,25 Q15,15 30,5 Z" fill="#ffffff" />
    <path d="M28,18 Q35,28 26,38 Q35,32 28,18 Z" fill="#3b7a99" />
    <text x="70" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">YERSIN UNIVERSITY</text>
  </g>

  <g transform="translate(560, 50)" text-anchor="end">
    <text x="0" y="30" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">TẠP CHÍ</text>
    <text x="0" y="65" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="800" fill="#ffe066" letter-spacing="1.5">KHOA HỌC YERSIN</text>
    <text x="0" y="88" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="1">TRƯỜNG ĐẠI HỌC YERSIN ĐÀ LẠT</text>
  </g>

  <!-- Illustration Area: Globe & International Trade -->
  <g transform="translate(240, 480)">
    <!-- Globe Circle -->
    <circle cx="0" cy="0" r="95" fill="url(#globe-glow)" stroke="#ffffff" stroke-width="2" />
    <!-- Continents silhouette mockup -->
    <path d="M-50,-40 Q-20,-70 20,-60 Q50,-30 40,0 Q30,40 -10,60 Q-60,40 -70,0 Z" fill="rgba(255,255,255,0.4)" />
    <!-- Lat/Long Lines -->
    <ellipse cx="0" cy="0" rx="95" ry="35" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="45" ry="95" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  </g>

  <!-- Light rays & Map elements -->
  <g transform="translate(300, 380)">
    <polygon points="0,0 200,-100 160,-130" fill="rgba(255,224,102,0.3)" />
    <polygon points="0,0 240,-50 220,-80" fill="rgba(255,224,102,0.4)" />
    <polygon points="0,0 200,20 220,-20" fill="rgba(255,224,102,0.25)" />
    <!-- Map Silhouette shape -->
    <path d="M80,-80 L120,-110 L160,-90 L180,-140 L210,-110 L190,-60 L140,-50 Z" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 780)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff">2025</text>
    <text x="95" y="-12" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffe066">Tập 22</text>
    <text x="95" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Volume 22</text>
  </g>

  <g transform="translate(550, 780)" text-anchor="end">
    <text x="0" y="-4" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#ffe066" letter-spacing="1">ISSN 2525-2372</text>
  </g>
</svg>
