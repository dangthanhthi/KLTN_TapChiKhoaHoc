<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066b3" />
      <stop offset="50%" stop-color="#0083cb" />
      <stop offset="100%" stop-color="#02a9ea" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="850" fill="url(#bg-gradient)" />
  <rect width="600" height="850" fill="url(#glow)" />

  <!-- Outer Hairline Frame -->
  <rect x="20" y="20" width="560" height="810" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(300, 75)" text-anchor="middle">
    <!-- University Logo Symbol -->
    <circle cx="0" cy="0" r="32" fill="#ffffff" />
    <path d="M-18,-8 L0,-18 L18,-8 L0,2 L-18,-8 Z" fill="#0066b3" />
    <path d="M-14,-2 L-14,10 Q0,18 14,10 L14,-2 Z" fill="none" stroke="#0066b3" stroke-width="2.5" />
    <circle cx="0" cy="4" r="5" fill="#fdb813" />
  </g>

  <!-- Title Group -->
  <text x="300" y="145" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="1">TẠP CHÍ KHOA HỌC</text>
  <text x="300" y="180" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="27" font-weight="800" fill="#ffe066" letter-spacing="1.5">ĐẠI HỌC CÔNG THƯƠNG</text>
  <text x="300" y="206" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffffff" letter-spacing="1.5">TRƯỜNG ĐẠI HỌC CÔNG THƯƠNG TP. HỒ CHÍ MINH</text>
  <text x="300" y="228" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="2">HUIT JOURNAL OF SCIENCE</text>

  <!-- Issue Badge Bar -->
  <g transform="translate(45, 255)">
    <rect x="0" y="0" width="160" height="52" rx="4" fill="rgba(0, 50, 100, 0.45)" stroke="rgba(255,255,255,0.5)" stroke-width="1" />
    <text x="80" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Vol.26 - No.3E</text>
    <text x="80" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffe066">2026</text>
  </g>

  <g transform="translate(395, 255)">
    <rect x="0" y="0" width="160" height="52" rx="4" fill="rgba(0, 50, 100, 0.45)" stroke="rgba(255,255,255,0.5)" stroke-width="1" />
    <text x="80" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">p-ISSN: 3030-4113</text>
    <text x="80" y="40" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">e-ISSN: 3030-413X</text>
  </g>

  <!-- Special Issue Header -->
  <text x="300" y="345" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-style="italic" font-size="16" font-weight="600" fill="#ffe066">Special Issue</text>
  <text x="300" y="375" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">The 3rd International Conference on Economics (ICE 2026)</text>
  <text x="300" y="400" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.9)">"The New Global Economy: Digital Transformation, Green Growth,</text>
  <text x="300" y="420" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.9)">and Human Resilience"</text>

  <!-- Scientific Network Graphic -->
  <g transform="translate(300, 600)">
    <!-- Connections -->
    <line x1="-160" y1="40" x2="-80" y2="-40" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="-80" y1="-40" x2="0" y2="20" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
    <line x1="0" y1="20" x2="90" y2="-50" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="90" y1="-50" x2="160" y2="30" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
    <line x1="-80" y1="-40" x2="90" y2="-50" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="-160" y1="40" x2="0" y2="20" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <line x1="0" y1="20" x2="160" y2="30" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

    <!-- Nodes -->
    <circle cx="-160" cy="40" r="14" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="2" />
    <circle cx="-80" cy="-40" r="18" fill="rgba(255,255,255,0.25)" stroke="#fff" stroke-width="2.5" />
    <circle cx="0" cy="20" r="24" fill="rgba(255,255,255,0.35)" stroke="#ffe066" stroke-width="3" />
    <circle cx="90" cy="-50" r="16" fill="rgba(255,255,255,0.25)" stroke="#fff" stroke-width="2" />
    <circle cx="160" cy="30" r="15" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="2" />

    <!-- Inner Icons / Dots -->
    <circle cx="0" cy="20" r="8" fill="#ffe066" />
    <circle cx="-80" cy="-40" r="6" fill="#ffffff" />
    <circle cx="90" cy="-50" r="5" fill="#ffffff" />
  </g>

  <!-- Footer Info -->
  <line x1="50" y1="760" x2="550" y2="760" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  <text x="300" y="790" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffffff">TRƯỜNG ĐẠI HỌC CÔNG THƯƠNG TP. HỒ CHÍ MINH (HUIT)</text>
  <text x="300" y="810" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.8)">http://journal.huit.edu.vn | https://huitjournal.vn</text>
</svg>
