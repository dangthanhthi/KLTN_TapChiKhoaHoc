<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-yersin-23" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b7a99" />
      <stop offset="35%" stop-color="#2a5d77" />
      <stop offset="70%" stop-color="#152736" />
      <stop offset="100%" stop-color="#0f1b26" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="850" fill="url(#bg-yersin-23)" />

  <!-- University Header Bar -->
  <g transform="translate(40, 50)">
    <!-- Yersin Flame Symbol -->
    <path d="M30,5 Q40,25 25,35 Q15,40 30,55 Q10,45 10,25 Q15,15 30,5 Z" fill="#ffffff" />
    <path d="M28,18 Q35,28 26,38 Q35,32 28,18 Z" fill="#3b7a99" />
    <text x="70" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">YERSIN UNIVERSITY</text>
  </g>

  <g transform="translate(560, 50)" text-anchor="end">
    <text x="0" y="30" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">TẠP CHÍ</text>
    <text x="0" y="65" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="800" fill="#ffe066" letter-spacing="1.5">KHOA HỌC YERSIN</text>
    <text x="0" y="88" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="1">TRƯỜNG ĐẠI HỌC YERSIN ĐÀ LẠT</text>
  </g>

  <!-- Illustration Area: Cybersecurity & Data Network -->
  <g transform="translate(300, 420)">
    <!-- Tech Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(29, 161, 242, 0.25)" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    
    <!-- Lock Body (Minh họa ổ khóa công nghệ số) -->
    <rect x="-35" y="-10" width="70" height="60" rx="10" fill="rgba(2, 169, 234, 0.3)" stroke="#02a9ea" stroke-width="3" />
    <!-- Lock Shackle -->
    <path d="M-22,-10 L-22,-35 Q0,-55 22,-35 L22,-10" fill="none" stroke="#02a9ea" stroke-width="4" stroke-linecap="round" />
    <!-- Keyhole -->
    <circle cx="0" cy="12" r="7" fill="#ffffff" />
    <path d="M-3,14 L3,14 L5,30 L-5,30 Z" fill="#ffffff" />

    <!-- Percentage Badge -->
    <rect x="90" y="40" width="60" height="28" rx="14" fill="#02a9ea" />
    <text x="120" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">97%</text>

    <rect x="-150" y="-30" width="55" height="24" rx="12" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="1" />
    <text x="-122" y="-14" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">42%</text>

    <!-- Digital Bars -->
    <line x1="-120" y1="80" x2="-120" y2="20" stroke="#02a9ea" stroke-width="4" stroke-linecap="round" />
    <line x1="-90" y1="80" x2="-90" y2="0" stroke="#00c853" stroke-width="4" stroke-linecap="round" />
    <line x1="-60" y1="80" x2="-60" y2="40" stroke="#ffe066" stroke-width="4" stroke-linecap="round" />
    <line x1="60" y1="80" x2="60" y2="10" stroke="#02a9ea" stroke-width="4" stroke-linecap="round" />
    <line x1="120" y1="80" x2="120" y2="-20" stroke="#00c853" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 780)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff">2026</text>
    <text x="95" y="-12" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffe066">Tập 23</text>
    <text x="95" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Volume 23</text>
  </g>

  <g transform="translate(550, 780)" text-anchor="end">
    <text x="0" y="-4" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#ffe066" letter-spacing="1">ISSN 2525-2372</text>
  </g>
</svg>
