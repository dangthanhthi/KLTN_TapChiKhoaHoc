<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạp chí điện tử · Tạp chí Khoa học Đại học Công Thương</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="journal-interactions.css">

<style>
  :root {
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --sky-050: #F3F8FD;
    --sky-100: #E4EFFA;
    --sky-200: #C9DFF4;
    --ink-900: #16202B;
    --ink-700: #3D4A57;
    --ink-500: #6B7684;
    --line: #E1E9F1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); color: var(--ink-900); background: #fff; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

  /* Breadcrumb */
  .breadcrumb-bar { background: #F8FAFC; border-bottom: 1px solid var(--line); padding: 12px 0; font-size: 12.5px; color: var(--ink-500); }
  .breadcrumb-bar a { color: #1da1f2; font-weight: 500; }
  .breadcrumb-bar a:hover { text-decoration: underline; }
  .breadcrumb-bar span.sep { margin: 0 8px; color: #CBD5E1; }

  /* Layout 2 cột chuẩn OJS */
  .archives-grid {
    display: grid;
    grid-template-columns: 1fr 310px;
    gap: 42px;
    padding: 32px 0 60px;
    align-items: start;
  }

  .archives-title {
    font-family: var(--sans);
    font-size: 26px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  /* Danh sách ấn phẩm (Mỗi số 1 hàng) */
  .archive-issue-item {
    display: flex;
    gap: 28px;
    padding: 24px 0;
    border-bottom: 1px solid #E5E7EB;
    align-items: flex-start;
  }
  .archive-issue-item:first-child {
    padding-top: 0;
  }

  .archive-issue-cover {
    width: 160px;
    min-width: 140px;
    border: 1px solid #E5E7EB;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-radius: 2px;
    overflow: hidden;
    background: #fff;
  }
  .archive-issue-cover img {
    width: 100%;
    height: auto;
    display: block;
  }

  .archive-issue-details {
    flex: 1;
    padding-top: 4px;
  }
  .archive-issue-name {
    font-size: 16.5px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .archive-issue-name a {
    color: #0066b3;
    text-decoration: none;
  }
  .archive-issue-name a:hover {
    text-decoration: underline;
  }

  .archive-issue-desc {
    font-size: 14px;
    color: #374151;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .archive-issue-toc-link {
    font-size: 13px;
    font-weight: 700;
    color: #0066b3;
    text-decoration: underline;
    display: inline-block;
  }
  .archive-issue-toc-link:hover {
    color: #004c85;
  }

  /* Phân trang (Pagination Controls) */
  .pagination-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .page-btn {
    border: 1px solid #CBD5E1;
    background: #ffffff;
    color: #1E293B;
    padding: 7px 15px;
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .page-btn:hover:not(:disabled) {
    border-color: #1da1f2;
    color: #1da1f2;
    background: #F0F9FF;
  }
  .page-btn.active {
    background: #1da1f2;
    color: #ffffff;
    border-color: #1da1f2;
  }
  .page-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* Sidebar chuẩn OJS */
  .sidebar-box {
    background: #ffffff;
    border: 1px solid #E5E7EB;
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 24px;
  }
  .sidebar-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    color: #16202B;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid #1da1f2;
    letter-spacing: .04em;
  }

  /* Bảng Citation Metrics */
  .metrics-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    margin-bottom: 16px;
  }
  .metrics-table th, .metrics-table td {
    padding: 6px 8px;
    text-align: right;
    border-bottom: 1px solid #F1F5F9;
  }
  .metrics-table th:first-child, .metrics-table td:first-child {
    text-align: left;
  }
  .metrics-table th {
    font-weight: 600;
    color: #64748B;
  }
  .metrics-table td {
    color: #1E293B;
    font-weight: 600;
  }

  /* Biểu đồ trích dẫn cột */
  .citation-chart {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 90px;
    padding-top: 10px;
    border-bottom: 1px solid #E2E8F0;
    margin-bottom: 8px;
  }
  .chart-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
    justify-content: flex-end;
  }
  .chart-bar {
    width: 100%;
    background: #93C5FD;
    border-radius: 2px 2px 0 0;
    transition: background .2s;
  }
  .chart-bar:hover {
    background: #3B82F6;
  }
  .chart-year {
    font-size: 9.5px;
    color: #64748B;
    transform: rotate(-45deg);
    transform-origin: center;
    margin-top: 6px;
  }

  /* Danh sách chỉ mục Indexing */
  .indexing-badge-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .indexing-badge-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 3px;
    font-size: 12.5px;
    font-weight: 600;
    color: #1E293B;
  }

  /* Lượt truy cập */
  .visitor-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 12.5px;
    border-bottom: 1px solid #F1F5F9;
  }
  .visitor-row:last-child {
    border-bottom: none;
  }

  @media (max-width: 992px) {
    .archives-grid {
      grid-template-columns: 1fr;
      gap: 36px;
    }
  }
  @media (max-width: 576px) {
    .archive-issue-item {
      flex-direction: column;
    }
    .archive-issue-cover {
      width: 100%;
      max-width: 220px;
    }
  /* BỘ CÔNG CỤ TÌM KIẾM BÀI BÁO CÔNG KHAI */
  .search-filter-card {
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 24px;
  }
  .search-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .search-input-box {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-input-box svg {
    position: absolute;
    left: 12px;
    width: 16px;
    height: 16px;
    stroke: #94A3B8;
    pointer-events: none;
  }
  .search-input-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border: 1px solid #CBD5E1;
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    color: #0F172A;
    background: #ffffff;
    outline: none;
    transition: all .2s;
  }
  .search-input-box input:focus {
    border-color: #1da1f2;
    box-shadow: 0 0 0 3px rgba(29, 161, 242, 0.15);
  }
  .btn-search-exec {
    background: #1da1f2;
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-search-exec:hover {
    background: #0c8cd8;
  }
  .btn-search-reset {
    background: #ffffff;
    border: 1px solid #CBD5E1;
    color: #475569;
    padding: 10px 16px;
    border-radius: 4px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-search-reset:hover {
    background: #F1F5F9;
    color: #0F172A;
  }

  .filter-controls-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .filter-select-group label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    color: #64748B;
    margin-bottom: 4px;
    letter-spacing: .02em;
  }
  .filter-select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #CBD5E1;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
    color: #1E293B;
    background: #ffffff;
    outline: none;
  }
  .filter-select:focus {
    border-color: #1da1f2;
  }

  /* TABS CHUYỂN ĐỔI CHẾ ĐỘ XEM */
  .view-tabs-header {
    display: flex;
    gap: 8px;
    border-bottom: 2px solid #E2E8F0;
    margin-bottom: 20px;
  }
  .view-tab-btn {
    background: none;
    border: none;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    color: #64748B;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all .2s;
  }
  .view-tab-btn:hover {
    color: #0F172A;
  }
  .view-tab-btn.active {
    color: #1da1f2;
    border-bottom-color: #1da1f2;
    font-weight: 700;
  }
  .tab-badge {
    background: #E2E8F0;
    color: #475569;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 700;
  }
  .view-tab-btn.active .tab-badge {
    background: rgba(29, 161, 242, 0.15);
    color: #1da1f2;
  }

  /* THẺ BÀI BÁO KHOA HỌC TRONG KẾT QUẢ TÌM KIẾM */
  .article-search-card {
    padding: 20px 0;
    border-bottom: 1px solid #E2E8F0;
  }
  .article-search-card:first-child {
    padding-top: 0;
  }
  .article-search-meta {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: #64748B;
    margin-bottom: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .article-search-badge {
    background: rgba(29, 161, 242, 0.1);
    color: #1da1f2;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11.5px;
  }
  .article-search-title {
    font-family: var(--serif);
    font-size: 17.5px;
    font-weight: 600;
    color: #0F172A;
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .article-search-title a {
    color: #0F172A;
    text-decoration: none;
  }
  .article-search-title a:hover {
    color: #1da1f2;
  }
  .article-search-authors {
    font-size: 13.5px;
    color: #475569;
    margin-bottom: 8px;
    font-style: normal;
  }
  .article-search-abstract {
    font-size: 13px;
    color: #334155;
    line-height: 1.55;
    margin-bottom: 12px;
  }
  .article-search-actions {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 12.5px;
  }
  .btn-article-detail {
    color: #1da1f2;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-article-detail:hover {
    text-decoration: underline;
  }
  .btn-article-pdf {
    background: #FEE2E2;
    color: #B91C1C;
    padding: 4px 10px;
    border-radius: 3px;
    font-weight: 700;
    font-size: 12px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-article-pdf:hover {
    background: #FECACA;
  }

  @media (max-width: 768px) {
    .filter-controls-row {
      grid-template-columns: 1fr;
    }
    .search-input-row {
      flex-direction: column;
    }
    .btn-search-exec, .btn-search-reset {
      width: 100%;
      justify-content: center;
    }
  }
</style>
</head>
<body>

<!-- KHỐI HEADER CHUNG (SHARED LAYOUT) -->
<div id="huit-header" data-active="archives"></div>

<!-- BREADCRUMB (THEO CHÍNH XÁC HÌNH ẢNH media_1789800570408.png) -->
<div class="breadcrumb-bar">
  <div class="wrap">
    <a href="UI_Mockup_He_Thong_Tap_Chi_Khoa_Hoc.html">Trang chủ</a>
    <span class="sep">/</span>
    <span style="color: #6B7684;">Tạp chí điện tử</span>
  </div>
</div>

<!-- THÂN TRANG KHO LƯU TRỮ (2 CỘT CHUẨN OJS) -->
<div class="wrap">
  <div class="archives-grid">
    
    <!-- CỘT CHÍNH (LEFT): DANH SÁCH TẠP CHÍ + PHÂN TRANG 5 SỐ / TRANG -->
    <main>
      <h1 class="archives-title">Tạp chí điện tử</h1>

      <!-- BỘ CÔNG CỤ TÌM KIẾM BÀI BÁO CÔNG KHAI (PUBLIC ARTICLE SEARCH) -->
      <section class="search-filter-card" aria-label="Tìm kiếm bài báo khoa học">
        <form id="public-search-form" onsubmit="handleArticleSearch(event)">
          <div class="search-input-row">
            <div class="search-input-box">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="search-keyword" placeholder="Nhập tiêu đề bài báo, tên tác giả, tóm tắt hoặc từ khóa..." autocomplete="off">
            </div>
            <button type="submit" class="btn-search-exec">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              Tìm kiếm
            </button>
            <button type="button" class="btn-search-reset" onclick="resetArticleSearch()">Đặt lại</button>
          </div>

          <div class="filter-controls-row">
            <div class="filter-select-group">
              <label for="filter-major">Lĩnh vực chuyên môn</label>
              <select id="filter-major" class="filter-select" onchange="handleFilterChange()">
                <option value="">-- Tất cả lĩnh vực khoa học --</option>
                <option value="Công nghệ thông tin">Công nghệ thông tin &amp; Trí tuệ nhân tạo</option>
                <option value="Cơ khí">Cơ khí – Chế tạo máy – Tự động hóa</option>
                <option value="Môi trường">Khoa học Môi trường &amp; Nông nghiệp</option>
                <option value="Kinh tế">Kinh tế – Quản trị kinh doanh &amp; Tài chính</option>
                <option value="Hóa học">Hóa học &amp; Công nghệ thực phẩm</option>
              </select>
            </div>
            <div class="filter-select-group">
              <label for="filter-issue">Số phát hành / Ấn phẩm</label>
              <select id="filter-issue" class="filter-select" onchange="handleFilterChange()">
                <option value="">-- Tất cả các số phát hành --</option>
                <option value="vol26_no3e">Tập 26 Số 3E (2026) - ICE 2026</option>
                <option value="vol26_no2e">Tập 26 Số 2E (2026) - VKSPE-SWPEA 2026</option>
                <option value="vol26_no1e">Tập 26 Số 1E (2026) - English Edition</option>
                <option value="vol26_no3">Tập 26 Số 3 (2026) - Tháng 06/2026</option>
                <option value="vol26_no2">Tập 26 Số 2 (2026) - Tháng 04/2026</option>
                <option value="vol26_no1">Tập 26 Số 1 (2026) - Tháng 02/2026</option>
                <option value="vol25_no6">Tập 25 Số 6 (2025) - Tháng 12/2025</option>
                <option value="vol25_no5">Tập 25 Số 5 (2025) - Tháng 10/2025</option>
                <option value="vol25_no4">Tập 25 Số 4 (2025) - Tháng 08/2025</option>
                <option value="vol25_no2">Tập 25 Số 2 (2025) - Tháng 04/2025</option>
              </select>
            </div>
          </div>
        </form>
      </section>

      <!-- TABS CHUYỂN ĐỔI CHẾ ĐỘ XEM: CÁC SỐ PHÁT HÀNH vs KẾT QUẢ TÌM KIẾM BÀI BÁO -->
      <div class="view-tabs-header">
        <button type="button" class="view-tab-btn active" id="tab-btn-issues" onclick="switchArchivesTab('issues')">
          <span>Các số phát hành</span>
          <span class="tab-badge" id="issuesCountBadge">10 số</span>
        </button>
        <button type="button" class="view-tab-btn" id="tab-btn-articles" onclick="switchArchivesTab('articles')">
          <span>Tìm kiếm bài báo</span>
          <span class="tab-badge" id="articlesCountBadge">0 bài</span>
        </button>
      </div>

      <!-- VÙNG 1: HIỂN THỊ DANH SÁCH CÁC SỐ PHÁT HÀNH (5 SỐ / TRANG) -->
      <div id="issuesListContainer">
        <!-- Javascript sẽ tự động điền danh sách số tùy theo trang hiện tại -->
      </div>

      <!-- VÙNG 2: HIỂN THỊ KẾT QUẢ TÌM KIẾM BÀI BÁO (ẨN MẶC ĐỊNH) -->
      <div id="articlesListContainer" style="display:none;">
        <!-- Javascript sẽ điền kết quả lọc bài báo khoa học -->
      </div>

      <!-- BỘ ĐIỀU KHIỂN PHÂN TRANG (PAGINATION) -->
      <div class="pagination-wrapper" id="paginationWrapper">
        <button type="button" class="page-btn" id="btnPrev" onclick="navigatePage(-1)">« Trước</button>
        <div id="pageNumbersContainer" style="display: flex; gap: 6px;"></div>
        <button type="button" class="page-btn" id="btnNext" onclick="navigatePage(1)">Sau »</button>
      </div>
    </main>

    <!-- CỘT PHỤ (RIGHT - SIDEBAR): THEO CHÍNH XÁC HÌNH ẢNH media_1789800570408.png -->
    <aside>
      <!-- 1. Bìa số hiện tại của tạp chí -->
      <div style="border: 1px solid #E5E7EB; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-radius: 3px; overflow: hidden; background: #fff; margin-bottom: 24px;">
        <img src="assets/images/cover_huit_vol26_no3e.jpg" alt="Bìa Tạp chí Khoa học Đại học Công Thương" style="width: 100%; height: auto; display: block;">
      </div>

      <!-- 2. ABSTRACTING & INDEXING -->
      <div class="sidebar-box" style="text-align: center;">
        <h4 class="sidebar-title" style="text-align: left;">ABSTRACTING &amp; INDEXING</h4>
        <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
          <div style="background: #ffffff; border: 1px solid #f1f5f9; border-radius: 4px; padding: 10px 12px; display: flex; align-items: center; justify-content: center;">
            <a href="https://vjol.info.vn/index.php/dhcongthuongHCM" target="_blank" rel="noopener" title="Vietnam Journals Online (VJOL)">
              <img src="assets/images/indexing/vjol-logo.png" alt="Vietnam Journals Online" style="max-width: 82%; max-height: 48px; height: auto; margin: 0 auto; display: block;">
            </a>
          </div>
          <div style="background: #ffffff; border: 1px solid #f1f5f9; border-radius: 4px; padding: 10px 12px; display: flex; align-items: center; justify-content: center;">
            <a href="https://www.turnitin.com/login_page.asp" target="_blank" rel="noopener" title="Turnitin Similarity Check">
              <img src="assets/images/indexing/turnitin-logo.svg" alt="Turnitin" style="max-width: 75%; max-height: 42px; height: auto; margin: 0 auto; display: block;">
            </a>

  // Điều khiển nút phân trang
  function renderPaginationButtons(currentPage, totalPages, onPageChange) {
    const numbersContainer = document.getElementById('pageNumbersContainer');
    numbersContainer.innerHTML = '';

    if (totalPages <= 1) {
      document.getElementById('paginationWrapper').style.display = 'none';
      return;
    }
    document.getElementById('paginationWrapper').style.display = 'flex';

    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `page-btn num-btn ${i === currentPage ? 'active' : ''}`;
      btn.textContent = i;
      btn.onclick = () => onPageChange(i);
      numbersContainer.appendChild(btn);
    }

    document.getElementById('btnPrev').disabled = currentPage === 1;
    document.getElementById('btnNext').disabled = currentPage === totalPages;
  }

  function navigatePage(direction) {
    if (currentViewTab === 'issues') {
      const totalPages = Math.ceil(archiveIssues.length / ITEMS_PER_PAGE) || 1;
      const target = currentIssuePage + direction;
      if (target >= 1 && target <= totalPages) {
        renderArchivePage(target);
        window.scrollTo({ top: 180, behavior: 'smooth' });
      }
    } else {
      const totalPages = Math.ceil(filteredArticles.length / ITEMS_PER_PAGE) || 1;
      const target = currentArticlePage + direction;
      if (target >= 1 && target <= totalPages) {
        renderArticlesPage(target);
        window.scrollTo({ top: 180, behavior: 'smooth' });
      }
    }
  }

  // Chuyển đổi tab hiển thị
  function switchArchivesTab(tabName) {
    currentViewTab = tabName;
    const btnIssues = document.getElementById('tab-btn-issues');
    const btnArticles = document.getElementById('tab-btn-articles');
    const issuesContainer = document.getElementById('issuesListContainer');
    const articlesContainer = document.getElementById('articlesListContainer');

    if (tabName === 'issues') {
      btnIssues.classList.add('active');
      btnArticles.classList.remove('active');
      issuesContainer.style.display = 'block';
      articlesContainer.style.display = 'none';
      renderArchivePage(currentIssuePage);
    } else {
      btnArticles.classList.add('active');
      btnIssues.classList.remove('active');
      issuesContainer.style.display = 'none';
      articlesContainer.style.display = 'block';
      renderArticlesPage(currentArticlePage);
    }
  }

  // Xử lý tìm kiếm bài báo
  function handleArticleSearch(e) {
    if (e) e.preventDefault();
    const keyword = (document.getElementById('search-keyword').value || '').trim().toLowerCase();
    const major = document.getElementById('filter-major').value;
    const issue = document.getElementById('filter-issue').value;

    filteredArticles = allArticles.filter(art => {
      // 1. Lọc theo từ khóa (tiêu đề, tác giả, tóm tắt)
      const matchKeyword = !keyword || 
        (art.tieuDe && art.tieuDe.toLowerCase().includes(keyword)) ||
        (art.tacGia && art.tacGia.toLowerCase().includes(keyword)) ||
        (art.tomTat && art.tomTat.toLowerCase().includes(keyword));

      // 2. Lọc theo chuyên ngành
      const matchMajor = !major || (art.chuyenNganh && art.chuyenNganh.includes(major));

      // 3. Lọc theo số báo
      const matchIssue = !issue || art.issueSlug === issue || (art.soTapChi && art.soTapChi.includes(issue));

      return matchKeyword && matchMajor && matchIssue;
    });

    document.getElementById('articlesCountBadge').innerText = `${filteredArticles.length} bài`;
    currentArticlePage = 1;
    switchArchivesTab('articles');
  }

  function handleFilterChange() {
    handleArticleSearch();
  }

  function resetArticleSearch() {
    document.getElementById('search-keyword').value = '';
    document.getElementById('filter-major').value = '';
    document.getElementById('filter-issue').value = '';
    filteredArticles = allArticles;
    document.getElementById('articlesCountBadge').innerText = `${allArticles.length} bài`;
    switchArchivesTab('issues');
  }

  // Khởi chạy nạp dữ liệu và hiển thị
  document.addEventListener('DOMContentLoaded', async () => {
    // 1. Tải danh sách các số phát hành từ API nếu có
    try {
      if (typeof apiGetPublishedIssues === 'function') {
        const liveIssues = await apiGetPublishedIssues();
        if (liveIssues && liveIssues.length > 0) {
          archiveIssues = liveIssues.map(s => ({
            id: s.maSoTapChi,
            slug: `vol${s.tap}_no${s.so}`,
            title: s.tenSo || `Tập ${s.tap} Số ${s.so} (${s.nam})`,
            desc: `Xuất bản định kỳ ${s.ngayPhatHanh ? new Date(s.ngayPhatHanh).toLocaleDateString('vi-VN') : s.nam} · ${s.tongSoBaiBao} bài báo khoa học đã xuất bản`,
            cover: s.anhBiaUrl || 'assets/images/cover_huit_vol26_no3e.jpg',
            link: `issue-detail.html?id=${s.maSoTapChi}`
          }));
        }
      }
    } catch (err) {
      console.warn('Sử dụng dữ liệu lưu trữ dự phòng:', err);
    }

    // 2. Tải danh sách bài báo mới nhất từ API phục vụ tìm kiếm
    try {
      if (typeof apiGetLatestArticles === 'function') {
        const liveArticles = await apiGetLatestArticles(50);
        if (liveArticles && liveArticles.length > 0) {
          // Merge hoặc dùng dữ liệu thật từ API
          const formatted = liveArticles.map(a => ({
            id: a.maBaiBao,
            maBaiBao: a.maBaiBao,
            tieuDe: a.tieuDe,
            tacGia: a.tacGiaChinh || (a.tacGias && a.tacGias.map(t => t.hoTen).join(', ')) || 'Tác giả HUIT',
            chuyenNganh: a.chuyenNganh || 'Khoa học tổng hợp',
            issueSlug: 'vol26_no3e',
            soTapChi: a.soTapChi || 'Tập 26 Số 3E (2026)',
            ngayDang: a.ngayXuatBan ? new Date(a.ngayXuatBan).toLocaleDateString('vi-VN') : '2026',
            doi: a.doi || '10.59876/jst.jsc.2026.03.01',
            tomTat: a.tomTat || 'Tóm tắt bài báo khoa học công bố trên Tạp chí Khoa học Đại học Công Thương.',
            pdfUrl: a.filePdfUrl || 'assets/sample-article.pdf'
          }));
          allArticles = [...formatted, ...HUIT_SAMPLE_ARTICLES];
          filteredArticles = allArticles;
        }
      }
    } catch (err) {
      console.warn('Sử dụng danh mục bài báo mẫu dự phòng:', err);
    }

    // Cập nhật badges
    document.getElementById('issuesCountBadge').innerText = `${archiveIssues.length} số`;
    document.getElementById('articlesCountBadge').innerText = `${allArticles.length} bài`;

    // Hiển thị tab các số phát hành ban đầu
    renderArchivePage(1);
  });
</script>
</body>
</html>
