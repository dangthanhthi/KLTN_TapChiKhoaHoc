<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Khôi phục mật khẩu · HUIT Journal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="journal-interactions.css"><link rel="stylesheet" href="workflow.css"><script src="journal-layout.js" defer></script><script src="journal-interactions.js" defer></script><script src="workflow-client.js" defer></script><script src="forgot-password.js" defer></script></head>
<body><div id="huit-header"></div><main class="workflow-page" style="max-width:600px"><h1>Khôi phục mật khẩu</h1><p>Nhập email tài khoản để nhận mã khôi phục có hiệu lực trong 10 phút.</p><div class="workflow-panel"><form id="reset-request"><label for="email">Email tài khoản</label><input id="email" type="email" autocomplete="email" maxlength="150" required><div class="workflow-actions"><button>Gửi mã khôi phục</button></div></form><form id="reset-confirm" hidden><label for="code">Mã khôi phục gồm 6 số</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><label for="password">Mật khẩu mới</label><input id="password" type="password" autocomplete="new-password" minlength="6" maxlength="72" required><label for="repeat">Nhập lại mật khẩu mới</label><input id="repeat" type="password" autocomplete="new-password" minlength="6" maxlength="72" required><div class="workflow-actions"><button>Cập nhật mật khẩu</button><button type="button" id="back">Đổi email hoặc gửi lại mã</button></div></form><div id="status" class="workflow-status" role="status" aria-live="polite"></div><a href="login.html">Trở về đăng nhập</a></div></main><div id="huit-footer"></div></body></html>
